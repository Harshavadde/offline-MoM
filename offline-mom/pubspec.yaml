name: offline_mom
description: "OfflineMoMAI - a fully offline AI meeting assistant: record or import a meeting, transcribe and summarize it entirely on-device."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+22

environment:
  # Bumped from ^3.5.0: freezed 3.x / json_serializable require ^3.8.0. The
  # actual toolchain here is Dart 3.12.2 (via the isolated Flutter 3.44 SDK
  # at C:\flutter_stable), well above this floor - this just tightens the
  # declared minimum to match what's really required now.
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^12.0.3
  intl: ^0.20.2
  share_plus: ^12.0.2
  go_router: ^15.1.2
  file_picker: ^11.0.2
  record: ^6.2.1
  pdf: ^3.11.3
  # Meeting/Resume PDF export (print/share sheet, `Printing.layoutPdf`/
  # `sharePdf`) only - NOT the Productivity Toolkit's PDF *rasterization*
  # path any more (Compress/Merge/Split/Organize/Redact/Edit). That moved
  # to `pdfrx` (below): `printing`'s own `Printing.raster()` rasterizes via
  # `android.graphics.pdf.PdfRenderer` on Android - the OS's own, often
  # font-support-limited PDF renderer, confirmed the root cause of a real
  # bug (a resume PDF with embedded/subsetted TrueType fonts rasterizing
  # to a near-blank page). See `pdfrx`'s own comment below and
  # `PdfiumPdfPageRenderingService`'s doc comment
  # (services/toolkit/pdf_page_rendering_service.dart).
  printing: ^5.14.3
  ffmpeg_kit_flutter_new: ^4.5.2
  whisper_flutter_new: ^1.0.1
  path: ^1.9.0
  llamadart: ^0.8.17
  local_auth: ^3.0.2
  audioplayers: ^6.8.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_foreground_task: ^10.0.0

  # PDF Security (V2 Productivity Toolkit, P0-8) - package:pdf's own
  # PdfEncryption extension point (lib/src/pdf/obj/encryption.dart) ships
  # zero concrete implementations, and its natural companion, pdf_crypto,
  # is effectively dead (absent from the current dart_pdf monorepo, only
  # distributed via the author's own unreliable private pub host - real,
  # reported "can't import" failures). Opening/unlocking a PDF encrypted by
  # another tool additionally needs a genuine PDF object-model reader
  # (xref/trailer/indirect-object parsing) this app has never had - the
  # same gap ADR-034/R-26 already found no mature, permissively-licensed
  # pure-Dart answer to, until now. `pdf_cos` (COS-layer tokenizer/parser/
  # xref/encryption, Apache-2.0, verified publisher benmilanko.com) and
  # `pdf_document` (page-tree/document semantics on top of it, same
  # publisher/license) together provide a real, pure-Dart, no-native-code
  # PDF reader with genuine RC4/AES encryption support - used ONLY for
  # P0-8's security operations (protect/open/unlock), never for page
  # generation - every existing PDF Tool keeps using `package:pdf`/the
  # established rasterize-and-rebuild pipeline (ADR-034) completely
  # unchanged. See ADR-046, docs/v2/implementation/03-decisions.md.
  pdf_cos: ^3.6.0
  pdf_document: ^3.6.0

  # Document workspace (V2 Phase 1A) - license-audited per ADR-016
  # (docs/v2/implementation/03-decisions.md), all MIT-licensed:
  # - read_pdf_text: PDF text extraction (wraps Android's PdfBox-Android
  #   port / iOS PDFKit natively - no pure-Dart PDF parser exists that's
  #   both mature and permissively licensed).
  # - archive + xml: DOCX extraction is hand-rolled on top of these two
  #   (a .docx is a zip of XML; see services/documents/parsers/docx_parser.dart)
  #   rather than depending on a thin, unmaintained wrapper package for
  #   something this small and central to the feature.
  read_pdf_text: ^0.3.1
  archive: ^4.0.9
  xml: ^7.0.1

  # Student Toolkit (V2 Phase 5A) - image compression/resize/conversion is
  # pure-Dart decode/encode (no native/licensed dependency, works fully
  # offline, deterministic and unit-testable without a device):
  # - image_picker: gallery pick + camera capture, the same first-party
  #   Flutter-team plugin pattern already used for file access elsewhere in
  #   this app (file_picker for documents).
  image_picker: ^1.1.2
  image: ^4.9.1

  # Offline OCR (V2 Productivity Toolkit, P0-7) - flutter_tesseract_ocr
  # (BSD-3-Clause) wraps Tesseract 4's on-device LSTM engine natively on
  # Android/iOS, actively maintained (published within the last 2 months
  # as of this audit, unlike the ~14-month-stale `tesseract_ocr`
  # alternative). Chosen over Google ML Kit specifically because ML Kit's
  # models download invisibly through Google Play Services with no
  # size/progress/resume control this app could surface in its own Model
  # Manager - `flutter_tesseract_ocr` instead loads plain `.traineddata`
  # files from an arbitrary on-disk path
  # (`FlutterTesseractOcr.getTessdataPath()`), which drops straight into
  # the existing `ModelDownloadService` HTTP-range-resume infrastructure
  # already used for Whisper models, with zero new download mechanism.
  # See ADR-045, docs/v2/implementation/03-decisions.md.
  flutter_tesseract_ocr: ^0.4.31

  # AI Model Manager (V2 Phase 6A) - was already resolved transitively via
  # `llamadart`'s own SHA-256 verification path, now a direct dependency
  # per this project's `depend_on_referenced_packages` convention: used
  # directly by `ModelDownloadService` to compute a local integrity
  # fingerprint for downloaded Whisper models (see ADR-036,
  # docs/v2/implementation/03-decisions.md).
  crypto: ^3.0.6
  # `AccumulatorSink` (streaming chunked-conversion sink) - pairs with
  # `crypto`'s `sha256.startChunkedConversion` so a large model file's
  # hash is computed incrementally as it downloads/reads, never by
  # buffering the whole file in memory first. Already resolved
  # transitively (a `crypto` dependency); direct here for the same reason.
  convert: ^3.1.1

  # Product Validation Phase (real-device crash fix): Android's own
  # bundled SQLite (what plain `sqflite` talks to via its platform-channel
  # backend) does not reliably have the FTS5 extension compiled in -
  # confirmed the real cause of a `no such module: fts5` crash during
  # `migrateV3ToV4` on a real device. `sqflite_common_ffi` was already a
  # dev-only dependency (every test's database goes through it, via
  # `test/test_helpers/test_database.dart`) - promoted to a real dependency
  # here because `lib/database/app_database.dart` now uses it in
  # production too, talking directly to a bundled SQLite via Dart FFI
  # instead of the OS's. `sqlite3_flutter_libs` supplies that bundled,
  # FTS5-enabled native library for every Android ABI (and other
  # platforms) - see ADR-038, docs/v2/implementation/03-decisions.md.
  sqflite_common_ffi: ^2.3.4+4
  sqlite3_flutter_libs: ^0.5.0

  # Deliberately NOT a dev_dependency (Product Validation Phase, R-26):
  # `GeneratedPluginRegistrant.java` references
  # `dev.flutter.plugins.integration_test.IntegrationTestPlugin`
  # unconditionally for every build variant regardless of where this
  # package is declared, but a release build's Gradle compile classpath
  # only includes dev_dependencies-only packages for debug/profile - so
  # `dev_dependencies` here made `flutter build apk --release` fail to
  # compile outright (confirmed root cause, reproduced twice before this
  # fix, previously documented as R-26/R-27). Declaring it as a regular
  # dependency puts it on every variant's classpath, matching what the
  # generated registrant already assumes. `integration_test/app_test.dart`
  # is a real, meaningful on-device test (not unused), so removing the
  # dependency instead of relocating it was not an option.
  integration_test:
    sdk: flutter

  # Resume/Career (V3 Milestone 0, docs/v3/01-prd.md §13) - only source in
  # this app of a device's total physical RAM (`AndroidDeviceInfo
  # .physicalRamSize`, megabytes), used to recommend rather than require a
  # stronger optional AI model. Never used to gate the feature itself - see
  # `DeviceCapabilityService`'s own doc comment.
  device_info_plus: ^12.4.0

  # Productivity Toolkit PDF rendering fix - `PdfiumPdfPageRenderingService`
  # (services/toolkit/pdf_page_rendering_service.dart), the new default
  # rasterization backend behind Compress/Merge/Split/Organize/Redact/Edit,
  # replacing `printing`'s `Printing.raster()` (which wraps Android's own
  # `android.graphics.pdf.PdfRenderer` - confirmed the root cause of a real
  # blank-page-on-embedded-font bug). `pdfrx` bundles real PDFium (MIT-
  # licensed via its own `pdfrx_engine`/`pdfium_flutter` dependencies, the
  # same rendering engine Chrome uses) rather than delegating to whatever
  # PDF support the OS happens to ship - confirmed by reading its Android
  # source directly, unlike `pdfx` (evaluated and rejected first: its
  # Android backend is *also* just `android.graphics.pdf.PdfRenderer` under
  # a different Dart API, which would not have fixed this bug at all).
  pdfrx: ^2.4.7
  # `pdfrx`'s own platform-agnostic core, resolved transitively via `pdfrx`
  # above but imported directly by `PdfiumPdfPageRenderingService` (its
  # `PdfDocument`/`PdfPage`/`PdfImage` types don't need `pdfrx`'s Flutter
  # widget layer at all) - listed directly per this project's own
  # `depend_on_referenced_packages` convention (same reasoning as
  # `crypto`/`convert` above).
  pdfrx_engine: ^0.4.5
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  # Direct dev dependency (Phase 4B) - was already resolved transitively via
  # `path_provider`, but `storage_providers_test.dart` imports it directly
  # to fake `getTemporaryDirectory()` in tests (mirrors this project's own
  # `depend_on_referenced_packages` lint requirement, same reasoning as
  # every other explicit dependency in this file).
  path_provider_platform_interface: ^2.1.2
  flutter_launcher_icons: ^0.14.4
  freezed: 3.2.5
  json_serializable: ^6.14.0
  build_runner: ^2.15.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - docs/legal/terms-of-service.md
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Bold.ttf
    - assets/fonts/Inter-Italic.ttf
    - assets/fonts/Inter-LICENSE.txt
    # flutter_tesseract_ocr's own extractText/extractHocr calls
    # unconditionally `rootBundle.loadString('assets/tessdata_config.json')`
    # before ever touching the real, separately-downloaded `.traineddata`
    # file (confirmed by reading the plugin's own `android_ios.dart`) - an
    # empty `"files": []` list means it copies nothing from a bundled
    # `assets/tessdata/` directory (this app deliberately has none - every
    # OCR language pack is downloaded post-install via `ModelDownloadService`,
    # never bundled into the APK), it just needs this one file to exist so
    # that lookup doesn't throw. See ADR-045.
    - assets/tessdata_config.json

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Physical-Mobile-First Validation phase (final beta build): scopes
# llamadart's native-assets build hook to the llama_cpp runtime family only
# - every model this app currently ships (2 LLMs, 1 embedding model, all
# Whisper tiers) resolves to a GGUF/ggml source (see
# lib/services/ai/model_catalog.dart), never a LiteRT-LM (.litertlm) one -
# see lib/services/ai/llamadart_llm_engine.dart and
# llamadart_embedding_engine.dart, both of which just construct
# LlamaEngine(LlamaBackend()) directly, with no code path in this app that
# ever selects LiteRT-LM specifically. Confirmed from the installed
# llamadart-0.8.17 package source itself (lib/src/hook/native_bundle_config.dart,
# hook/build.dart) - NOT a --dart-define (an earlier investigation's
# assumption that turned out to be wrong): the actual mechanism is this
# hooks.user_defines block, read via `input.userDefines['llamadart_native_runtimes']`
# in the package's own build hook. A bare list here (rather than the
# nested `runtimes:`/`platforms:` map shown in llamadart's own example
# app) applies globally to every target platform this app builds for,
# which is exactly the desired "no LiteRT-LM anywhere" outcome - a
# per-platform override isn't needed since no platform here should ever
# want LiteRT-LM. Both defaults ('llama_cpp' and 'litert_lm') were
# previously bundled on Android; this drops the never-exercised second
# runtime's native libraries from the built APK.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
  # see https://flutter.dev/to/font-from-package
