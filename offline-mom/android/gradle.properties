# Capped hard: this server is shared with a live production Postgres
# instance and has only 8GB RAM / 2 vCPUs total. The default -Xmx4G daemon
# once pushed the box down to ~1.3GB free RAM and nearly exhausted the page
# file. org.gradle.daemon=false additionally makes sure no Gradle process
# lingers in the background consuming memory once a build finishes.
#
# R-9: even the 2560m cap above crashed the daemon with a genuine native
# OOM (hs_err_pid*.log: "Native memory allocation (mmap) failed") twice in
# a row - free RAM on this host had dropped to ~2.7GB at the time,
# insufficient headroom for a 2560m heap plus its own native/metaspace/GC
# overhead during R8/dexing's peak usage. Lowered further so the daemon's
# total footprint comfortably fits within what's actually free, at the
# cost of a slower build (more frequent GC) - not a correctness change.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=true
# AGP pinned below 9 (see settings.gradle.kts) specifically so every plugin
# (file_picker, ffmpeg_kit_flutter_new, record_android, share_plus) applies
# Kotlin the same old-style way, instead of straddling AGP 9's Built-in
# Kotlin transition where different plugin versions disagree.
android.builtInKotlin=false
android.newDsl=false
